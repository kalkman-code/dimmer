<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <clipPath id="sharp">
      <rect x="100" y="100" width="824" height="412"/>
    </clipPath>
    <clipPath id="frosted">
      <rect x="100" y="512" width="824" height="412"/>
    </clipPath>
    <filter id="veil-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#141416" filter="url(#shadow)"/>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="#141416"/>
    <g clip-path="url(#sharp)">
      <polygon points="512,180 844,512 512,844" fill="#FFFFFF"/>
      <polygon points="512,180 512,844 180,512" fill="#E2E5EA"/>
    </g>
    <g clip-path="url(#frosted)">
      <g filter="url(#veil-blur)">
        <polygon points="512,180 844,512 512,844" fill="#FFFFFF"/>
        <polygon points="512,180 512,844 180,512" fill="#E2E5EA"/>
      </g>
      <rect x="100" y="512" width="824" height="412" fill="#B9C8E6" fill-opacity="0.15"/>
      <line x1="100" y1="512" x2="924" y2="512" stroke="#B9C8E6" stroke-width="4" stroke-opacity="0.5"/>
      <line x1="100" y1="514" x2="924" y2="514" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7"/>
    </g>
  </g>
</svg>
